<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PIT/LANE – Formula 1</title>
  <meta name="description" content="F1 calendar, race weekends, results, standings and records.">
  <meta name="theme-color" content="#0E0301">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <!-- the two fonts every page uses straight away start downloading early -->
  <link rel="preload" href="fonts/bebas-neue-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/barlow-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // apply a saved theme before the first paint to avoid a flash
    try {
      const theme = localStorage.getItem('pitlane:theme');
      if (theme) document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a href="#/" class="logo">PIT<span>/</span>LANE</a>
      <nav class="nav" id="nav">
        <a href="#/" data-route="pitwall">Pit Wall</a>
        <a href="#/calendar" data-route="calendar">Calendar</a>
        <a href="#/results" data-route="results">Results</a>
        <a href="#/standings" data-route="standings">Standings</a>
        <a href="#/records" data-route="records">Records</a>
      </nav>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle light/dark mode"></button>
    </div>
  </header>

  <div class="status-banner" id="status-banner" role="status" hidden></div>

  <main id="app" class="container" tabindex="-1"></main>

  <footer class="site-footer container">
    Data: <a href="https://github.com/jolpica/jolpica-f1" target="_blank" rel="noopener">Jolpica-F1 API</a><span id="updated"></span>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
